name: Portfolio checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  portfolio-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
